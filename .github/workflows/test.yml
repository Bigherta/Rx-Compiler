name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-venv

      - name: Install coverage tools
        run: |
          python3 -m venv target/coverage-venv
          target/coverage-venv/bin/python -m pip install -r scripts/requirements-coverage.txt

      - name: Run semantic regression tests with branch coverage
        env:
          PYTHON: target/coverage-venv/bin/python
        run: bash scripts/coverage.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-coverage
          path: |
            target/coverage/
            target/tests/
          if-no-files-found: warn
          retention-days: 14
