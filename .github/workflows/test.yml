name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 cmake python3-venv

      - name: Install coverage tools
        run: |
          python3 -m venv target/coverage-venv
          target/coverage-venv/bin/python -m pip install -r scripts/requirements-coverage.txt

      - name: Run semantic regression tests with branch coverage
        env:
          PYTHON: target/coverage-venv/bin/python
        run: bash scripts/coverage.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-coverage
          path: |
            target/coverage/
            target/tests/
          if-no-files-found: warn
          retention-days: 14

  ir:
    name: IR regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-14 g++-14 cmake python3 wget lsb-release software-properties-common gnupg
          wget -q https://apt.llvm.org/llvm.sh -O "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22

      - name: Set up xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '2.9.9'

      - name: Build REIMU
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          xmake f -y -P vendor/REIMU -m release -o target/reimu
          xmake -y -P vendor/REIMU

      - name: Build Rx compiler
        run: |
          cmake -S . -B target/oj-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 \
            -DRX_USE_SYSTEM_ANTLR=OFF -DRX_FAST_BUILD=ON
          cmake --build target/oj-build --target rx_compiler -j2

      - name: Run official and custom IR regression tests
        # BUILD must populate the runner's fresh {runtime}, even with a prebuilt compiler.
        run: |
          make test STAGE=ir CLANG=clang-22 \
            'IR=./target/oj-build/src/rx_compiler {source} -o {output}' \
            'BUILD=clang-22 --target=riscv32-unknown-elf -march=rv32im -mabi=ilp32 -O2 -fno-builtin -S vendor/runtime/runtime.c -o {runtime}'

      - name: Upload IR test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ir-test-logs
          path: target/tests/
          if-no-files-found: warn
          retention-days: 14
